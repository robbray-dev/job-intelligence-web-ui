<div id="filter-box">
    <h3>Filters</h3>
    <hr>
    <h3>Role</h3>
    <mat-checkbox>Backend</mat-checkbox>
    <mat-checkbox>DevOps</mat-checkbox>
    <mat-checkbox>Full Stack</mat-checkbox>
    <mat-checkbox>Data</mat-checkbox>
    <hr>
    <h3>Location</h3>
    <mat-checkbox>Remote</mat-checkbox>
    <mat-checkbox>San Fransico</mat-checkbox>
    <mat-checkbox>New York</mat-checkbox>
    <mat-checkbox>Austin</mat-checkbox>
    <mat-checkbox>Seattle</mat-checkbox>
    <hr>
    <h3 id="remote">Remote Only</h3>
    <ng-toggle
      [value]="true"
      [color]="{
        unchecked: '#939da2',
        checked: '#f62d51'
      }"
    ></ng-toggle>
  
   <hr>

</div>
