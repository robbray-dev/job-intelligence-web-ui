<div id="background-div">
  <h1 id="browse-jobs">Browse Jobs</h1>
  <div id="inner-one">
    <app-filter-box></app-filter-box>
    <div id="inner-two">
      <mat-form-field id="search-bar">
        <input type="text" matInput placeholder="Search" />
        <button matSuffix mat-button><mat-icon>search</mat-icon></button>
      </mat-form-field>
      <div id="header-search">
        <h2 id="header-one-search">Backend Jobs</h2>
      </div>
      <h3>437 Backend Jobs available</h3>
      <div id="job-listing-container">
        <ul>
          @for (job of jobs; track job) {
            <li>{{ job }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
</div>
